<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <title>Переводчик из десятиричной системы в двоичную и наоборот</title>
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="/2To10/images/ICON.png">
    </head>
    <body>
        <div class="header">
            <nav>
                <img src="images/ICON.png" height="70" width="70">
                <div class="ZagoLOVEok">
                    Перевод чисел из систем счисления
                </div>
                <div class="Podskazka">
                    Введите число и выберите систему счисления для автоматического перевода
                </div>
                <form id="converterForm">
                    <div class="Polya">
                        <input id="inputNumber" type="text" placeholder="Введите число">
                        <input id="resultNumber" type="text" placeholder="Результат" readonly>
                    </div>
                    <div class="Vibor">
                        <select id="fromSystem">
                            <option>Двоичная</option>
                            <option>Восьмиричная</option>
                            <option selected>Десятиричная</option>
                            <option>Шестнадцатиричная</option>
                        </select>
                        <select id="toSystem">
                            <option selected>Двоичная</option>
                            <option>Восьмиричная</option>
                            <option>Десятиричная</option>
                            <option>Шестнадцатиричная</option>
                        </select>
                    </div>
                    <div class="Knopka">
                        <button type="button" onclick="convertNumber()">Перевести</button>
                    </div>
                    <div id="errorMessage" class="Oshipka"></div>
                </form>
            </nav>
        </div>
        <script src="Odin.js"></script>
    </body>
</html>
