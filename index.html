<html>

                    </select>
                    <select name="System2">
                        <option selected>Двоичная</option>
                        <option>Восьмиричная</option>
                        <option>Десятиричная</option>
                        <option>Шестнадцатиричная</option>
                    </select>
                </li>
                <li class="Knopka">
                    <button type="submit">Перевести</button>
                </li>
                <li type="text" class="Oshipka">
                    
                </li>
